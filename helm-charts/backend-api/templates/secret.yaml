apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  # Ключи берутся как есть из secrets-production.yaml и через envFrom.secretRef
  # становятся именами переменных окружения. Поэтому в secrets-production.yaml
  # они должны называться ровно так, как их читает приложение (backend/src/db.ts):
  # DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME.
  {{- range $key, $val := .Values.secret }}
  {{ $key }}: {{ $val | toString | b64enc | quote }}
  {{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secret
type: Opaque
data:
  # Ключи здесь — это имена переменных окружения в контейнере (envFrom.secretRef
  # подставляет их как есть). Приложение читает DB_HOST/DB_PORT/DB_USER/
  # DB_PASSWORD/DB_NAME, поэтому маппинг задан явно, а не range по .Values.secret.
  DB_HOST: {{ .Values.secret.dbHost | b64enc | quote }}
  DB_PORT: {{ .Values.secret.dbPort | b64enc | quote }}
  DB_USER: {{ .Values.secret.dbUser | b64enc | quote }}
  DB_PASSWORD: {{ .Values.secret.dbPassword | b64enc | quote }}
  DB_NAME: {{ .Values.secret.dbName | b64enc | quote }}
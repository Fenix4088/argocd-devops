replicaCount: 2
 
labels:
  - name: app
    value: backend-api
 
image:
  name: fenix4088/lessons-todo-back
  pullSecret: dockerhub-cred
 
backend:
  port: 3005
 
probes:
  health: /api/health
  # Приложение регистрирует /api/health/ready (см. RouterExplorer в логах).
  # На /api/ready отдаётся 404, из-за чего pod никогда не становится Ready.
  ready: /api/health/ready
 
resources:
  requests:
    cpu: "60m"
    memory: "100Mi"
  limits:
    cpu: "100m"
    memory: "120Mi"
 
envs:
  configMap:
    NODE_ENV: "staging"
    PORT: "3005"
 
ingress:
  host: api.plikap.com
  tlsSecret: backend-api-tls
  clusterIssuer: letsencrypt-prod
 
hpa:
  minReplicas: 1
  maxReplicas: 5
  cpuUtilization: 70
  memoryUtilization: 80
 
monitoring:
  release: kube-prometheus-stack

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true